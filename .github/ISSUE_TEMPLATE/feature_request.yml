name: 功能建议 / Feature request
title: "[Feature] "
description: 提出银杏助手的使用体验或开发改进建议
body:
  - type: markdown
    attributes:
      value: |
        规则失效或具体应用无法跳过，可直接使用 https://feedback.xadskip.com/ 。
        此处用于公开讨论产品与开发建议；请勿上传个人敏感资料。
        已有建议见 https://github.com/luke-opus/yinxing-assistant/issues 。
  - type: textarea
    id: problem
    attributes:
      label: 希望解决什么问题
      description: 描述使用场景和目前遇到的不便。
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 你的建议
      description: 描述期望的操作方式或结果。
    validations:
      required: true
