name: 应用错误 / Bug report
title: "[Bug] "
description: 报告银杏助手应用或开发工具的问题
body:
  - type: markdown
    attributes:
      value: |
        普通使用与规则适配可通过 https://feedback.xadskip.com/ 私下反馈。
        GitHub Issue 是公开内容；请勿附上未经检查的日志、快照、聊天截图、账号、验证码或身份材料。
        可先搜索 https://github.com/luke-opus/yinxing-assistant/issues 中的已有问题。
  - type: input
    id: version
    attributes:
      label: 银杏助手版本
      placeholder: 例如 0.3.4
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 手机与系统（选填）
      placeholder: 品牌、型号、Android 版本；不要填写设备序列号
  - type: textarea
    id: reproduce
    attributes:
      label: 如何出现问题
      description: 简单描述操作步骤、预期结果和实际结果。不需要先上传日志。
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: 补充信息（选填）
      description: 可附经过脱敏的截图、错误文字或关联反馈编号；敏感材料请用私有反馈页面。
