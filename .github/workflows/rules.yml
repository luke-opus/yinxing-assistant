name: Rule conversion checks
on:
  push:
    paths: ['tools/**', 'third_party/**', 'rules/**', 'UPSTREAM.json', 'gkd-app/src/main/assets/xadskip/**', '.github/workflows/rules.yml']
  pull_request:
    paths: ['tools/**', 'third_party/**', 'rules/**', 'UPSTREAM.json', 'gkd-app/src/main/assets/xadskip/**', '.github/workflows/rules.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r tools/requirements.txt
      - run: python tools/bundle_community_rules.py --check
      - run: python tools/build_unified_rules.py --check
      - run: python -m unittest discover -s tools -p 'test_*.py' -v
      - run: python tools/convert_ltt.py
      - run: git diff --exit-code -- rules/conversion-report.json gkd-app/src/main/assets/xadskip/ltt-drafts.json
      - run: npm ci --prefix tools/selector-check --ignore-scripts
      - run: npm test --prefix tools/selector-check
