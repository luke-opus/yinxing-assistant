name: Android development build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 37.0 and Build Tools 37.0.0
        run: sdkmanager --channel=0 'platforms;android-37.0' 'build-tools;37.0.0'
      - run: chmod +x gradlew
      - name: Show build tool versions
        run: |
          java -version
          ./gradlew --version
          sdkmanager --list_installed
      - name: Verify bundled community assets
        run: python3 tools/bundle_community_rules.py --check
      - name: Test bundled rules and build APK
        run: ./gradlew :gkd-app:testGkdDebugUnitTest --tests li.gkd.app.data.XAdSkipRulePackTest :gkd-app:assembleGkdDebug --no-daemon
      - name: Verify subscriptions inside APK
        run: python3 tools/bundle_community_rules.py --check --apk-dir gkd-app/build/outputs/apk/gkd/debug
      - uses: actions/upload-artifact@v4
        with:
          name: XAdSkip-development-apk
          path: gkd-app/build/outputs/apk/gkd/debug/*.apk
          if-no-files-found: error
          retention-days: 7
