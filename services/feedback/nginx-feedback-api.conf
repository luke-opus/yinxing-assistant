# Include inside the feedback.xadskip.com HTTPS server {} block.
# Configure certificates and the static frontend web root separately.
# Never create an alias/root pointing at /var/lib/xadskip-feedback.
client_max_body_size 60m;
client_header_timeout 15s;
client_body_timeout 30s;

location = /api/feedback {
    proxy_pass http://127.0.0.1:8768;
    proxy_http_version 1.1;
    proxy_request_buffering on;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;
    proxy_set_header Connection "close";
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}
location = /api/health {
    proxy_pass http://127.0.0.1:8768;
    proxy_set_header Connection "close";
    proxy_connect_timeout 5s;
    proxy_read_timeout 5s;
}
location /api/ { return 404; }
